<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova Visita</title>
    <link rel="stylesheet" href="/css/novoCad.css" />
  </head>
  <body>
    <form action="" id="formEditVisita">
      <input type="hidden" name="pessoa_id" id="pessoaIdInput" />

      <div class="dataAssunto">
        <div>
          <label for="">Data: </label>
          <input type="date" name="data" id="data" class="select" />
        </div>

        <div>
          <label for="">Assunto: </label>
          <input type="text" name="assunto" id="assunto" class="linhaAssunto" />
        </div>
      </div>
      <div class="descricao">
        <h1>Descrição</h1>
        <textarea
          name="descricao"
          id="descricao"
          rows="20"
          cols="100"
        ></textarea>
      </div>

      
      <div class="botao">
        <a id="voltar" class="btn">Voltar</a>
        <button type="submit" class="btn">ATUALIZAR</button>
      </div>
    </form>

    <script>
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");

      fetch(`/api/relatorio/${id}`)
        .then((res) => res.json())
        .then((dados) => {
          function dataParaInput(dataBR) {
            const [dia, mes, ano] = dataBR.split("/");
            return `${ano}-${mes}-${dia}`;
          }

          document.getElementById("data").value = dataParaInput(dados.DATA);

          document.getElementById("assunto").value = dados.ASSUNTO;
          document.getElementById("descricao").value = dados.DESCRICAO;
        });

      const voltar = document.getElementById("voltar");
      voltar.href = `detalhesCadGeral.html?id=${id}`;
    </script>

    <script src="/js/editVisitas.js"></script>
  </body>
</html>
