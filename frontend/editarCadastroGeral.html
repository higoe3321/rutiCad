<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>editarCadastroGeral</title>
    <link rel="stylesheet" href="/frontend/css/novoCad.css" />
  </head>
  <body>
    <a id="voltar">Voltar</a>
    <form id="formEditCadGeral">
      <div class="dadosPessoais">
        <h1>Dados Pessoais</h1>
        <div>
          <label for="nome">Nome:</label>
          <input type="text" id="nome" class="linha" />
        </div>
        <div>
          <label for="email">E-mail:</label>
          <input type="text" id="email" class="linha" />
        </div>
        <div>
          <label for="tel">Telefone:</label>
          <input type="text" id="tel" class="linha" />
        </div>
        <div>
          <select name="documento" id="tipoDocumento" class="select">
            <option value="CPF">CPF</option>
            <option value="RG">RG</option>
            <option value="CNPJ">CNPJ</option>
          </select>
          <input type="text" id="documento" class="linha" />
        </div>
        <div>
          <label for="data">Data de Nascimento:</label>
          <input type="date" id="data" class="select" />
        </div>
        <div>
          <label for="profissao">Profissão:</label>
          <input type="text" id="profissao" class="linha" />
        </div>
      </div>
      <div class="logradouro">
        <h1>Logradouro</h1>
        <div>
          <label for="cep">CEP:</label>
          <input type="text" id="cep" class="linha" />
        </div>
        <div>
          <label for="estado">Estado:</label>
          <select id="estado" name="estado" class="select">
            <option value="AC">AC</option>
            <option value="AL">AL</option>
            <option value="AP">AP</option>
            <option value="AM">AM</option>
            <option value="BA">BA</option>
            <option value="CE">CE</option>
            <option value="DF">DF</option>
            <option value="ES">ES</option>
            <option value="GO">GO</option>
            <option value="MA">MA</option>
            <option value="MT">MT</option>
            <option value="MS">MS</option>
            <option value="MG">MG</option>
            <option value="PA">PA</option>
            <option value="PB">PB</option>
            <option value="PR">PR</option>
            <option value="PE">PE</option>
            <option value="PI">PI</option>
            <option value="RJ">RJ</option>
            <option value="RN">RN</option>
            <option value="RS">RS</option>
            <option value="RO">RO</option>
            <option value="RR">RR</option>
            <option value="SC">SC</option>
            <option value="SP">SP</option>
            <option value="SE">SE</option>
            <option value="TO">TO</option>
          </select>
        </div>
        <div>
          <label for="cidade">Cidade:</label>
          <input type="text" id="cidade" class="linha" />
        </div>
        <div>
          <label for="bairro">Bairro:</label>
          <input type="text" id="bairro" class="linha" />
        </div>
        <div>
          <label for="rua">Rua:</label>
          <input type="text" id="rua" class="linha" />
          <label for="numero">Nº:</label>
          <input type="number" id="numero" class="linha" />
        </div>
        <div>
          <label for="complemento">Complemento:</label>
          <input type="text" id="comp" class="linha" />
        </div>
      </div>
      <div class="descricao">
        <h1>Descrição</h1>
        <textarea
          name="descricao"
          id="descricao"
          rows="20"
          cols="100"
        ></textarea>
      </div>
      <div class="botao">
        <button type="submit" class="btn">ATUALIZAR</button>
      </div>
    </form>

    <script>
      const params = new URLSearchParams(window.location.search);
      const id = params.get("id");

      fetch(`http://localhost:3000/api/cadastro-geral/${id}`)
        .then((res) => res.json())
        .then((dados) => {
          document.getElementById("nome").value = dados.NOME;
          document.getElementById("email").value = dados.EMAIL;
          document.getElementById("tel").value = dados.TELEFONE;
          document.getElementById("tipoDocumento").value = dados.TIPOID;
          document.getElementById("documento").value = dados.DOCUMENTO;

          if (dados.DATANASC) {
            const dataFormatada = new Date(dados.DATANASC)
              .toISOString()
              .split("T")[0];

            document.getElementById("data").value = dataFormatada;
          }

          document.getElementById("profissao").value = dados.PROFISSAO;

          document.getElementById("cep").value = dados.CEP;
          document.getElementById("estado").value = dados.ESTADO;
          document.getElementById("cidade").value = dados.CIDADE;
          document.getElementById("bairro").value = dados.BAIRRO;
          document.getElementById("rua").value = dados.RUA;
          document.getElementById("numero").value = dados.NUMEROCASA;
          document.getElementById("comp").value = dados.COMPLEMENTO;

          document.getElementById("descricao").value = dados.DESCRICAO;
        });

        const voltar = document.getElementById("voltar");
          voltar.href = `detalhesCadGeral.html?id=${id}`;
    </script>
    <script src="/frontend/js/editCadGrl.js"></script>
  </body>
</html>
