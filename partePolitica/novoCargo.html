<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Adicionar Cargo</title>
    <link rel="stylesheet" href="/frontend/css/novoCad.css" />
  </head>
  <body>
    <form action="" id="formNovoCargo">
      <div>
        <label for="cargo">Cargo:</label>
        <input type="text" class="linha" id="cargo" />
      </div>
      <div class="descricao">
        <h1>Descrição</h1>
        <textarea
          name="descricao"
          id="descricao"
          rows="20"
          cols="100"
        ></textarea>
      </div>
      <button type="submit" class="btn">Enviar</button>
    </form>
    <script src="/frontend/js/novoCargo.js"></script>
  </body>
</html>
